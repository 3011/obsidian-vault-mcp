apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
  labels:
    app: obsidian-vault-mcp
    profile: personal-full-access
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-vault-mcp
  template:
    metadata:
      labels:
        app: obsidian-vault-mcp
        profile: personal-full-access
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: obsidian-vault-mcp
          image: ghcr.io/YOUR_ORG/obsidian-vault-mcp:dev
          imagePullPolicy: Always
          env:
            - name: VAULT_ROOT
              value: /data/vault
            - name: DEFAULT_WRITE_DIR
              value: 98-Inbox
            - name: MCP_REQUIRE_TOKEN
              value: "false"
            - name: READ_ONLY
              value: "false"
            - name: ENABLE_VAULT_WRITE
              value: "true"
            - name: ENABLE_VAULT_APPEND
              value: "true"
            - name: ENABLE_VAULT_PATCH
              value: "true"
            - name: ENABLE_VAULT_DELETE
              value: "true"
            - name: ENABLE_VAULT_MOVE
              value: "true"
            - name: ENABLE_APPEND_TO_INBOX
              value: "true"
            - name: ENABLE_AUDIT_LOG
              value: "true"
            - name: AUDIT_LOG_PATH
              value: /data/audit/obsidian-vault-mcp.audit.log
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: vault
              mountPath: /data/vault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-vault-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
  labels:
    app: obsidian-vault-mcp
    profile: personal-full-access
spec:
  type: ClusterIP
  selector:
    app: obsidian-vault-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
