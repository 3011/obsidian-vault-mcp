apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-vault-mcp
  labels:
    app: obsidian-vault-mcp
    profile: personal-full-access
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-vault-mcp
  template:
    metadata:
      labels:
        app: obsidian-vault-mcp
        profile: personal-full-access
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: obsidian-vault-mcp
          image: ghcr.io/3011/obsidian-vault-mcp:main
          imagePullPolicy: Always
          env:
            - name: VAULT_ROOT
              value: /data/vault
            - name: DEFAULT_WRITE_DIR
              value: 98-Inbox
            - name: WRITE_ALLOWED_ROOTS
              value: 00-系统,01-归档,02-学习,03-工作,04-个人,98-Inbox,99-回收站
            - name: MAX_REQUEST_BYTES
              value: "16777216"
            - name: MCP_REQUIRE_TOKEN
              value: "false"
            - name: READ_ONLY
              value: "false"
            - name: ENABLE_VAULT_WRITE
              value: "true"
            - name: ENABLE_VAULT_APPEND
              value: "true"
            - name: ENABLE_VAULT_PATCH
              value: "true"
            - name: ENABLE_VAULT_DELETE
              value: "true"
            - name: ENABLE_VAULT_MOVE
              value: "true"
            - name: ENABLE_APPEND_TO_INBOX
              value: "true"
            - name: ENABLE_IMAGE_ASSETS
              value: "true"
            - name: ENABLE_EXTERNAL_REFERENCE_NOTES
              value: "true"
            - name: ASSETS_DIR_NAME
              value: assets
            - name: MAX_IMAGE_ASSET_BYTES
              value: "10485760"
            - name: ALLOWED_IMAGE_MIME_TYPES
              value: image/png,image/jpeg,image/webp,image/gif
            - name: IMAGE_ASSET_INTEGRITY_MODE
              value: required_for_preserve_original
            - name: ENABLE_AUDIT_LOG
              value: "true"
            - name: AUDIT_LOG_PATH
              value: /data/audit/obsidian-vault-mcp.audit.log
            - name: MUTATION_QUEUE_DIR
              value: /mutations
            - name: TRASH_DELETE
              value: "true"
            - name: TRASH_DIR
              value: .trash
            - name: BACKUP_BEFORE_WRITE
              value: "true"
            - name: BACKUP_DIR
              value: .backups
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: vault
              mountPath: /data/vault
            - name: vault
              mountPath: /data/audit
              subPath: .audit
            - name: mutations
              mountPath: /mutations
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-vault-mcp
        - name: mutations
          persistentVolumeClaim:
            claimName: obsidian-mutations
