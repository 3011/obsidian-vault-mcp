apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
  labels:
    app: obsidian-vault-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-vault-mcp
  template:
    metadata:
      labels:
        app: obsidian-vault-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: obsidian-vault-mcp
          image: ghcr.io/3011/obsidian-vault-mcp:main
          imagePullPolicy: Always
          env:
            - name: VAULT_ROOT
              value: /data/vault
            - name: DEFAULT_WRITE_DIR
              value: 98-Inbox
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: obsidian-vault-mcp-token
                  key: MCP_TOKEN
            - name: MCP_REQUIRE_TOKEN
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: vault
              mountPath: /data/vault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-vault-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-vault-mcp
  namespace: YOUR_NAMESPACE
spec:
  selector:
    app: obsidian-vault-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
